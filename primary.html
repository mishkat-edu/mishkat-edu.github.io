<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التعليم الابتدائي - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<script>try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
<style>
:root{--ink:#1f2a44;--muted:#5b6b86;--card:#fff;--blue:#1d8cf8;--shadow:rgba(31,42,68,.16);color-scheme:light}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--blue:#4aa8ff;--shadow:rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'Tajawal',system-ui,sans-serif;min-height:100vh;padding:34px 5% 44px;background:linear-gradient(160deg,#fff6c9 0%,#dff4ff 45%,#ffe6f2 100%);color:var(--ink);text-align:center;overflow-x:hidden;position:relative}
:root[data-theme="dark"] body{background:linear-gradient(160deg,#1b2a4a,#0d141c 60%,#2a1b33)}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.deco span{position:absolute;font-size:30px;opacity:.55;animation:float 6s ease-in-out infinite}
.deco span:nth-child(1){top:6%;right:6%;animation-delay:0s}
.deco span:nth-child(2){top:14%;left:7%;animation-delay:-1s;font-size:36px}
.deco span:nth-child(3){top:38%;right:4%;animation-delay:-2s;font-size:26px}
.deco span:nth-child(4){top:55%;left:4%;animation-delay:-3s}
.deco span:nth-child(5){top:78%;right:9%;animation-delay:-4s;font-size:34px}
.deco span:nth-child(6){top:86%;left:10%;animation-delay:-2.5s;font-size:28px}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(12deg)}}
.wrap{max-width:640px;margin:0 auto;position:relative;z-index:1}
.logo{font-weight:800;font-size:18px;margin-bottom:14px}
.hello{display:inline-block;background:#fff;color:#1f2a44;border-radius:999px;padding:12px 26px;border:3px solid #ffb703;box-shadow:0 10px 26px var(--shadow);font-weight:800;font-size:clamp(18px,4vw,26px);direction:ltr;letter-spacing:.3px;animation:wobble 4s ease-in-out infinite}
@keyframes wobble{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
h1{font-size:clamp(26px,5.5vw,38px);font-weight:800;margin:22px 0 4px;background:linear-gradient(90deg,#ff6b6b,#ffb703,#2ec4b6,#4361ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:17px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:24px auto 0}
.grid>.kc:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 8px)}
.kc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:150px;padding:18px 10px;border-radius:26px;background:var(--c,#ffd54a);border:4px solid #fff;box-shadow:0 10px 0 rgba(31,42,68,.12),0 16px 30px var(--shadow);color:#1f2a44;font-family:inherit;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .2s;animation:bob 3.5s ease-in-out infinite}
.kc:nth-child(2n){animation-delay:-1.2s}
.kc:nth-child(3n){animation-delay:-2.1s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.kc:hover,.kc:focus-visible{transform:translateY(-5px) rotate(-2deg);animation-play-state:paused}
.kc:active{transform:translateY(2px)}
.em{font-size:54px;line-height:1.1}
.nm{font-size:20px;line-height:1.3}

/* بطاقات الفصول */
.terms{display:grid;grid-template-columns:1fr;gap:14px;margin:24px auto 0;max-width:460px}
.term{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border-radius:26px;background:var(--c,#ffd54a);border:4px solid #fff;box-shadow:0 10px 0 rgba(31,42,68,.12),0 16px 30px var(--shadow);color:#1f2a44;font-family:inherit;text-align:right;text-decoration:none;cursor:pointer;transition:transform .2s}
.term:hover,.term:focus-visible{transform:translateY(-4px)}
.term:active{transform:translateY(2px)}
.term-n{flex:none;width:58px;height:58px;border-radius:50%;background:#fff;color:#1f2a44;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:inset 0 0 0 3px rgba(31,42,68,.1)}
.term-t{flex:1;min-width:0}
.term-t b{display:block;font-size:21px;font-weight:800;line-height:1.3}
.term-t small{display:block;margin-top:2px;font-size:13.5px;font-weight:700;color:rgba(31,42,68,.72)}
.term-go{flex:none;font-size:24px;font-weight:800}

.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.back,.home,.mode{display:inline-block;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none}
.back:hover,.home:hover,.mode:hover{background:var(--blue);color:#fff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:90vw;padding:12px 22px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:420px){.em{font-size:44px}.nm{font-size:17px}.kc{min-height:132px}.term-t b{font-size:19px}}
@media (prefers-reduced-motion:reduce){.deco span,.kc,.hello{animation:none}}
</style>
</head>
<body>
<div class="deco" aria-hidden="true"><span>⭐</span><span>📚</span><span>✏️</span><span>🎈</span><span>🌈</span><span>🎨</span></div>
<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <div class="hello" id="hello">مرحبا بك في منصة MISHKAT</div>
  <h1 id="ttl">التعليم الابتدائي</h1>
  <p class="sub" id="sub">اختر السنة الدراسية</p>
  <div class="grid" id="grid"></div>
  <div class="bar">
    <a class="back" id="backb" href="primary.html">← رجوع</a>
    <a class="home" id="homeb" href="index.html">🏠 العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
var $=function(i){return document.getElementById(i);};
var root=document.documentElement, modeBtn=$('mode');
function paint(){modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';}
paint();
modeBtn.onclick=function(){
  var d=root.getAttribute('data-theme')==='dark';
  if(d){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',d?'light':'dark');}catch(e){}
  paint();
};

var toast=$('toast'), tm;
function say(m){toast.textContent=m;toast.classList.add('on');clearTimeout(tm);tm=setTimeout(function(){toast.classList.remove('on');},2600);}

/* ✏️ ملفات كتب الأنشطة لكل سنة:
   lang = كتاب الأنشطة اللغوية (يفتح عند اختيار اللغة العربية)
   sport = كتاب الأنشطة الرياضية (يفتح عند اختيار الرياضيات)
   إذا لم يوجد الملف تظهر رسالة «قيد الإعداد» */
var PDFS={
  1:{lang:'lang1.pdf',sport:'sport1.pdf'},
  2:{lang:'lang2.pdf',sport:'sport2.pdf'},
  5:{lang:'lang5.pdf'}
};

/* ✏️ ملفات الاختبارات: المفتاح = السنة-المادة-الفصل ، والقيمة = اسم الملف
   رموز المواد: math arabic science islam history english civic french
   مثال:  '1-math-1':'exam-1-math-1.pdf'   (السنة الأولى، الرياضيات، الفصل الأول) */
var EXAMS={
};

var TERMS=[
  {t:1,n:'الفصل الأول',c:'#ffd54a'},
  {t:2,n:'الفصل الثاني',c:'#8ee6a0'},
  {t:3,n:'الفصل الثالث',c:'#7fd3ff'}
];

var YEARS=[
  {y:1,n:'1 ابتدائي',e:'🌱',c:'#ffd54a'},
  {y:2,n:'2 ابتدائي',e:'🌿',c:'#8ee6a0'},
  {y:3,n:'3 ابتدائي',e:'🌳',c:'#7fd3ff'},
  {y:4,n:'4 ابتدائي',e:'🌻',c:'#ffa6c9'},
  {y:5,n:'5 ابتدائي',e:'🌟',c:'#ffb36b'}
];
var SUBS=[
  {k:'math',n:'الرياضيات',e:'🔢',c:'#ffd54a'},
  {k:'arabic',n:'اللغة العربية',e:'📝',c:'#8ee6a0'},
  {k:'science',n:'التربية العلمية',e:'🔬',c:'#7fd3ff'},
  {k:'islam',n:'التربية الإسلامية',e:'🕌',c:'#ffa6c9'}
];
var EXTRA3=[
  {k:'history',n:'التاريخ والجغرافيا',e:'🌍',c:'#b6f0e6'},
  {k:'english',n:'الإنجليزية',e:'🇬🇧',c:'#ffc9b0'}
];
var EXTRA4=[
  {k:'civic',n:'التربية المدنية',e:'🤝',c:'#ffe08a'},
  {k:'french',n:'الفرنسية',e:'🇫🇷',c:'#bfe3ff'}
];

var P=new URLSearchParams(location.search);
var Y=parseInt(P.get('y'),10)||0, S=P.get('s')||'', K=P.get('k')||'';
var yr=YEARS.filter(function(x){return x.y===Y;})[0]||null;
if(!yr) Y=0;
var pool=SUBS.concat(Y>=3?EXTRA3:[], Y>=4?EXTRA4:[]);
var sb=Y?(pool.filter(function(x){return x.k===S;})[0]||null):null;
if(!sb) S='';
if(!Y){S='';}
if(!S){K='';}
if(K!=='exams') K='';

function url(o){
  var p=[];
  if(o.y) p.push('y='+o.y);
  if(o.s) p.push('s='+o.s);
  if(o.k) p.push('k='+o.k);
  return 'primary.html'+(p.length?'?'+p.join('&'):'');
}

var title, subt, hello;
if(!Y){
  title='التعليم الابتدائي'; subt='اختر السنة الدراسية'; hello='مرحبا بك في منصة MISHKAT';
}else if(!S){
  title=yr.n; subt='اختر المادة'; hello='مرحبا بكم في منصة MISHKAT';
}else if(K){
  title='اختر الفصل'; subt='الاختبارات • '+sb.n+' • '+yr.n; hello='مرحبا بكم في منصة MISHKAT';
}else{
  title=sb.n; subt=yr.n; hello='مرحبا بكم في منصة MISHKAT';
}
$('hello').textContent=hello;
$('ttl').textContent=title;
$('sub').textContent=subt;
document.title=title+' - أكاديمية مشكاة';

(function(){
  var b=$('backb');
  if(!Y){b.hidden=true;return;}
  b.hidden=false;
  b.href=!S?'primary.html':(K?url({y:Y,s:S}):url({y:Y}));
})();

function card(label,em,color,href,onclick){
  var el=document.createElement(href?'a':'button');
  el.className='kc';
  if(href){el.href=href;}else{el.type='button';el.onclick=onclick;}
  el.style.setProperty('--c',color);
  el.innerHTML='<span class="em">'+em+'</span><span class="nm">'+label+'</span>';
  return el;
}

/* بطاقة تفتح الكتاب داخل عارض المنصة (pdfview.html)، وإن لم يوجد الملف تعرض «قيد الإعداد» */
function pdfCard(label,em,color,file){
  if(file){
    return card(label,em,color,'pdfview.html?f='+encodeURIComponent(file)+'&t='+encodeURIComponent('كتاب الأنشطة • '+sb.n+' • '+yr.n));
  }
  return card(label,em,color,null,function(){say(label+' لـ'+yr.n+' قيد الإعداد ✨');});
}

/* بطاقة فصل دراسي */
function termCard(tr){
  var file=EXAMS[Y+'-'+S+'-'+tr.t]||'';
  var el=document.createElement(file?'a':'button');
  el.className='term';
  if(file){
    el.href='pdfview.html?f='+encodeURIComponent(file)+'&t='+encodeURIComponent('اختبارات '+tr.n+' • '+sb.n+' • '+yr.n);
  }else{
    el.type='button';
    el.onclick=function(){say('اختبارات «'+sb.n+'» — '+tr.n+' قيد الإعداد ✨');};
  }
  el.style.setProperty('--c',tr.c);
  el.innerHTML='<span class="term-n">'+tr.t+'</span>'
    +'<span class="term-t"><b>'+tr.n+'</b><small>اختبارات '+tr.n+' • '+sb.n+'</small></span>'
    +'<span class="term-go">←</span>';
  return el;
}

var g=$('grid');
if(!Y){
  YEARS.forEach(function(y){g.appendChild(card(y.n,y.e,y.c,url({y:y.y})));});
}else if(!S){
  pool.forEach(function(s){g.appendChild(card(s.n,s.e,s.c,url({y:Y,s:s.k})));});
}else if(K){
  g.className='terms';
  TERMS.forEach(function(tr){g.appendChild(termCard(tr));});
}else{
  var files=PDFS[Y]||{};
  g.appendChild(card('الاختبارات','📋','#8ee6a0',url({y:Y,s:S,k:'exams'})));
  g.appendChild(card('الدروس','📖','#7fd3ff',null,function(){say('دروس «'+sb.n+'» قيد الإعداد ✨');}));
  if(S==='arabic'){
    g.appendChild(pdfCard('كتب الأنشطة','📒','#ffd54a',files.lang));
    g.appendChild(card('المحفوظات','🎵','#ffa6c9',null,function(){say('محفوظات «'+sb.n+'» قيد الإعداد ✨');}));
  }else if(S==='math'){
    g.appendChild(pdfCard('كتب الأنشطة','📒','#ffd54a',files.sport));
  }else{
    g.appendChild(card('كتب الأنشطة','📒','#ffd54a',null,function(){say('كتب الأنشطة لـ'+sb.n+' قيد الإعداد ✨');}));
  }
}
</script>
</body>
</html>
